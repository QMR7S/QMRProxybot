name: Validate QMR Proxy (no deployment)
on:
  push:
    branches: [main, 'review/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python checks
        run: python3 -m unittest discover -s tests -v
      - name: MTProto installer shell check
        run: bash -n proxy-node/install.sh
      - name: JavaScript checks
        run: |
          node --check site/app.js
          node --check site/sw.js
          node --check tgcloud/handlers/message.js
          node --check tgcloud/lib/nodes.js
          node --check handoff/miniapp-v7/site/app.js
          node --check handoff/miniapp-v7/site/sw.js
          node --check handoff/miniapp-v7/site/telegram-miniapp.js
          node --check tgcloud/lib/ui.js
          node --check tgcloud/lib/store.js
          node --check tgcloud/handlers/callback_query.js
          node --check tgcloud/schema.js
      - name: QMR Proxy v6 simulated flows
        run: node tests/smoke.mjs
      - name: TGCloud root repair syntax
        run: bash -n scripts/repair-tgcloud-root.sh

      - name: Cloud recovery audit shell syntax
        run: bash -n tools/cloud-recovery-audit.sh

      - name: Native cloud board tests
        run: |
          node --test tests/cloud_boards.test.mjs
          node --check tgcloud/lib/cloud_boards.js
          node --check tgcloud/endpoints/qmr_admin.js
          node --check tgcloud/endpoints/qmr_ops.js
          node --check cloud-overlay/admin/admin.js
          node --check cloud-overlay/ops/ops.js

      - name: Native source validation
        run: node --test tests/extra_cloud.test.mjs

      - name: Cloud V14 staging syntax
        run: |
          bash -n tools/deploy_cloud_v14.sh
          python3 -m py_compile tools/cloud_v14_stage.py

      - name: Node 22 for SQLite integration
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native board real SQLite
        run: node --test tests/cloud_boards_sqlite.test.mjs

      - name: Controlled notification SQL and concurrency
        run: node --test tests/broadcast_control_sqlite.test.mjs
